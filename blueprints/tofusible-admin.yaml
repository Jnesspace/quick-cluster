inputs:
  - id: aws_integration_id
    name: AWS Integration ID
    description: "ID of the AWS integration to attach to the stack"
    type: short_text
    default: "01JV4YKENC7KXV3MNBYPSH88AX"  # jakespace
  - id: resource_space_id
    name: Space ID for Child Resources
    description: "Spacelift Space ID used by the OpenTofu, Ansible and Kubernetes stacks that this admin stack creates"
    type: short_text
    default: "test-01K09P35SJAB2S1C856MEGPJZX"
  - id: subnet_mode
    name: Subnet Mode
    description: "Choose whether to create a new subnet or use an existing one"
    type: select
    options:
      - create_new
      - use_existing
    default: use_existing
  - id: subnet_id
    name: AWS Subnet ID (only if Subnet Mode = use_existing)
    description: "Paste an existing subnet identifier like subnet-0abc1234. Leave blank when Subnet Mode is create_new."
    type: short_text
    validations:
      pattern: "^subnet-[0-9a-fA-F]+$"
      required: false
  - id: aws_default_region
    name: AWS Region
    description: "AWS region (e.g., eu-west-1)"
    type: short_text
  - id: ansible_worker_pool_id
    name: Ansible Worker Pool ID (optional)
    description: "Worker pool ID for Ansible runs; leave empty to use public worker pool"
    type: short_text
    default: ""


  - id: instance_type
    name: EC2 Instance Type
    description: "Size of EC2 instances for the cluster"
    type: select
    options:
      - t3.small
      - t3.medium
      - t3.large
    default: t3.small

  - id: stack_prefix
    name: Stack Name Prefix (optional)
    description: "Prefix added to all stack names; if left blank, a random string will be used"
    type: short_text
    default: ""

  - id: repo_branch
    name: Repository Branch
    description: "Git branch of this repository to use (default: main)"
    type: short_text
    default: "main"

options:
  trigger_run: true  # Automatically trigger a run after creation

stack:
  name: '${{ (inputs.stack_prefix != "" ? inputs.stack_prefix : context.random_string) + "-Tofusible-Admin" }}'
  space: root  # The blueprint creator can adjust this if needed
  description: Admin stack that provisions OpenTofu, Ansible and Kubernetes stacks.
  labels:
    - tofusible
    - admin
    - blueprint
  auto_deploy: true
  vcs:
    branch: ${{ inputs.repo_branch }}
    repository: Quick-Cluster
    provider: GITHUB
    project_root: stacks/admin
  vendor:
    terraform:
      manage_state: true
      version: "1.6.0"
      workflow_tool: OPEN_TOFU

  attachments:
    clouds:
      aws:
        id: ${{ inputs.aws_integration_id }}
        read: true
        write: true

  environment:
    variables:
      - name: TF_VAR_aws_integration_id
        value: ${{ inputs.aws_integration_id }}
      - name: TF_VAR_resource_space_id
        value: ${{ inputs.resource_space_id }}
      - name: TF_VAR_subnet_id
        value: '${{ inputs.subnet_mode == "use_existing" ? inputs.subnet_id : "" }}'
      - name: TF_VAR_aws_default_region
        value: ${{ inputs.aws_default_region }}
      - name: TF_VAR_ansible_worker_pool_id
        value: ${{ inputs.ansible_worker_pool_id }}
      - name: TF_VAR_create_new_subnet
        value: '${{ inputs.subnet_mode == "create_new" ? "true" : "false" }}'
      - name: TF_VAR_instance_type
        value: ${{ inputs.instance_type }}
      - name: AWS_DEFAULT_REGION
        value: ${{ inputs.aws_default_region }} 