{{- $domain := required "spacelift.shared.serverHostname is required" .Values.spacelift.shared.serverHostname -}}
apiVersion: v1
kind: Secret
metadata:
  name: spacelift-shared
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: spacelift
type: Opaque
stringData:
  SERVER_DOMAIN: {{ $domain | quote }}
  MQTT_BROKER_TYPE: builtin
  MQTT_BROKER_ENDPOINT: tls://spacelift-mqtt.{{ .Release.Namespace }}.svc.cluster.local:1984
  ENCRYPTION_TYPE: rsa
  ENCRYPTION_RSA_PRIVATE_KEY: {{ required "encryption.rsaPrivateKey is required (base64 RSA key; see scripts/gen-rsa-key.sh)" .Values.encryption.rsaPrivateKey | quote }}
  MESSAGE_QUEUE_TYPE: postgres
  OBJECT_STORAGE_TYPE: minio
  OBJECT_STORAGE_MINIO_ENDPOINT: {{ include "spacelift.minioEndpoint" . | quote }}
  OBJECT_STORAGE_MINIO_USE_SSL: {{ .Values.objectStorage.useSSL | quote }}
  OBJECT_STORAGE_MINIO_ALLOW_INSECURE: {{ .Values.objectStorage.allowInsecure | quote }}
  OBJECT_STORAGE_MINIO_ACCESS_KEY_ID: {{ include "spacelift.minioAccessKey" . | quote }}
  OBJECT_STORAGE_MINIO_SECRET_ACCESS_KEY: {{ include "spacelift.minioSecretKey" . | quote }}
  OBJECT_STORAGE_BUCKET_DELIVERIES: spacelift-deliveries
  OBJECT_STORAGE_BUCKET_LARGE_QUEUE_MESSAGES: spacelift-large-queue-messages
  OBJECT_STORAGE_BUCKET_MODULES: spacelift-modules
  OBJECT_STORAGE_BUCKET_POLICY_INPUTS: spacelift-policy-inputs
  OBJECT_STORAGE_BUCKET_RUN_LOGS: spacelift-run-logs
  OBJECT_STORAGE_BUCKET_STATES: spacelift-states
  OBJECT_STORAGE_BUCKET_USER_UPLOADED_WORKSPACES: spacelift-user-uploaded-workspaces
  OBJECT_STORAGE_BUCKET_WORKSPACE: spacelift-workspaces
  OBJECT_STORAGE_BUCKET_USAGE_ANALYTICS: ""
  OBJECT_STORAGE_BUCKET_UPLOADS_URL: {{ required "objectStorage.publicUrl is required" .Values.objectStorage.publicUrl | quote }}
  DATABASE_URL: {{ include "spacelift.databaseUrl" . | quote }}
  LICENSE_TYPE: jwt
  LICENSE_TOKEN: {{ required "license.token is required" .Values.license.token | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: spacelift-server
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: spacelift
type: Opaque
stringData:
  ADMIN_USERNAME: {{ required "admin.username is required" .Values.admin.username | quote }}
  ADMIN_PASSWORD: {{ required "admin.password is required" .Values.admin.password | quote }}
  OBJECT_STORAGE_BUCKET_UPLOADS: spacelift-uploads
  WEBHOOKS_ENDPOINT: https://{{ $domain }}/webhooks
---
apiVersion: v1
kind: Secret
metadata:
  name: spacelift-drain
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: spacelift
type: Opaque
stringData:
  LAUNCHER_IMAGE: {{ required "launcher.image is required" .Values.launcher.image | quote }}
  LAUNCHER_IMAGE_TAG: {{ required "launcher.tag is required" .Values.launcher.tag | quote }}
  OBJECT_STORAGE_BUCKET_METADATA: spacelift-metadata
