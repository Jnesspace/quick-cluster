# Minimal overrides to get a working install. Copy to values-secrets.yaml,
# fill in, and keep it OUT of git (.gitignore already excludes it):
#
#   cp values-secrets.example.yaml values-secrets.yaml
#   helm dependency build
#   helm install spacelift . -n spacelift --create-namespace -f values-secrets.yaml

license:
  token: "<license-jwt-from-spacelift>"

admin:
  username: admin
  password: "CHANGEME-admin"

encryption:
  # Output of ./scripts/gen-rsa-key.sh
  rsaPrivateKey: "<base64-encoded-rsa-private-key>"

launcher:
  image: "your-registry.example.com/spacelift-launcher"
  tag: "v4.0.0"

objectStorage:
  publicUrl: "https://minio.spacelift.example.com"

spacelift:
  shared:
    serverHostname: "spacelift.example.com"
    image: "your-registry.example.com/spacelift-backend:v4.0.0"
  ingress:
    ingressClassName: nginx
  # Scale the app here (or via --set / helm upgrade):
  server:
    replicaCount: 1
  drain:
    replicaCount: 1

minio:
  rootPassword: "CHANGEME-root"
  users:
    - accessKey: spacelift
      secretKey: "CHANGEME-spacelift-key"
      policy: readwrite
  ingress:
    hosts:
      - minio.spacelift.example.com
    tls:
      - secretName: minio-tls
        hosts:
          - minio.spacelift.example.com

postgres:
  auth:
    password: "CHANGEME-db"
