{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: spacelift-postgres
  labels:
    app: spacelift-postgres
    app.kubernetes.io/part-of: spacelift
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app: spacelift-postgres
{{- end }}
