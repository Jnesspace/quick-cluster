---
apiVersion: v1
kind: Namespace
metadata:
  name: tofusible
  labels:
    name: tofusible
    managed-by: spacelift
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-example
  namespace: tofusible
  labels:
    app: nginx-example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-example
  template:
    metadata:
      labels:
        app: nginx-example
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: tofusible
spec:
  selector:
    app: nginx-example
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  type: NodePort