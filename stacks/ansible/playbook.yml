---
- name: Deploy K3s Cluster
  hosts: tofu
  become: yes
  gather_facts: yes
  vars:
    k3s_version: "v1.28.5+k3s1"
    k3s_server_node: "{{ groups['tofu'][0] }}"
    k3s_token: "{{ ansible_date_time.epoch }}-tofusible-cluster"
    
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - htop
          - vim
          - net-tools
          - jq
          - iputils-ping
          - telnet
        state: present

    - name: Create K3s directory
      ansible.builtin.file:
        path: /opt/k3s
        state: directory
        mode: '0755'

# K3s Server Installation (First Node)
- name: Install K3s Server
  hosts: "{{ groups['tofu'][0] }}"
  become: yes
  gather_facts: yes
  vars:
    k3s_version: "v1.28.5+k3s1"
    k3s_token: "{{ ansible_date_time.epoch }}-tofusible-cluster"
    
  tasks:
    - name: Check if we're running in check mode (planning)
      ansible.builtin.debug:
        msg: |
          ========================================
          K3S SERVER INSTALLATION
          ========================================
          Check mode (planning): {{ ansible_check_mode }}
          {% if ansible_check_mode %}
          ⚠️  Running in planning mode - K3s installation will be skipped
          ⚠️  Actual deployment will install K3s server
          {% else %}
          ✅ Running in deployment mode - Installing K3s server
          {% endif %}
          ========================================

    - name: Download K3s binary
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
        dest: /usr/local/bin/k3s
        mode: '0755'
        owner: root
        group: root
      when: not ansible_check_mode

    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - \
          --token "{{ k3s_token }}" \
          --node-external-ip "{{ ansible_default_ipv4.address }}" \
          --node-ip "{{ private_ip }}" \
          --cluster-init \
          --disable traefik \
          --write-kubeconfig-mode 644
      args:
        creates: /etc/systemd/system/k3s.service
      when: not ansible_check_mode

    - name: Ensure K3s service is started and enabled
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: yes
        daemon_reload: yes
      when: not ansible_check_mode

    - name: Verify K3s binary is available
      ansible.builtin.command: which k3s
      register: k3s_binary_check
      failed_when: false
      when: not ansible_check_mode

    - name: Debug K3s installation status
      ansible.builtin.debug:
        msg: |
          K3s binary location: {{ k3s_binary_check.stdout | default('NOT FOUND') }}
          K3s service status will be checked next...
      when: not ansible_check_mode

    - name: Check K3s service status
      ansible.builtin.systemd:
        name: k3s
      register: k3s_service_status
      when: not ansible_check_mode

    - name: Display K3s service status
      ansible.builtin.debug:
        msg: |
          K3s service status: {{ k3s_service_status.status.ActiveState | default('unknown') }}
          Service enabled: {{ k3s_service_status.status.UnitFileState | default('unknown') }}
      when: not ansible_check_mode

    - name: Wait for K3s server to be ready
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ private_ip }}"
        delay: 10
        timeout: 300
      when: not ansible_check_mode

    - name: Get K3s server status
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_nodes
      retries: 5
      delay: 10
      until: k3s_nodes.rc == 0
      when: not ansible_check_mode

    - name: Display K3s server status
      ansible.builtin.debug:
        msg: "K3s server is ready: {{ k3s_nodes.stdout_lines | default(['Not available in check mode']) }}"

    # Planning mode summary for server installation
    - name: K3s server installation summary (planning mode)
      ansible.builtin.debug:
        msg: |
          ========================================
          📋 K3S SERVER INSTALLATION PLAN
          ========================================
          
          During actual deployment, this node will:
          
          1. ✅ Download K3s {{ k3s_version }} binary
          2. ✅ Install K3s server with cluster-init
          3. ✅ Configure external IP: {{ ansible_default_ipv4.address }}
          4. ✅ Configure internal IP: {{ private_ip }}
          5. ✅ Start and enable K3s systemd service
          6. ✅ Wait for API server on port 6443
          7. ✅ Verify cluster initialization
          
          ⚠️  Installation skipped during planning
          ✅ Actual deployment will install everything
          ========================================
      when: ansible_check_mode

# K3s Agent Installation (Remaining Nodes)
- name: Install K3s Agents
  hosts: tofu:!{{ groups['tofu'][0] }}
  become: yes
  gather_facts: yes
  vars:
    k3s_version: "v1.28.5+k3s1"
    k3s_token: "{{ ansible_date_time.epoch }}-tofusible-cluster"
    k3s_server_ip: "{{ hostvars[groups['tofu'][0]]['private_ip'] }}"
    
  tasks:
    - name: Check if we're running in check mode (planning)
      ansible.builtin.debug:
        msg: |
          ========================================
          K3S AGENT INSTALLATION
          ========================================
          Check mode (planning): {{ ansible_check_mode }}
          {% if ansible_check_mode %}
          ⚠️  Running in planning mode - K3s agent installation will be skipped
          ⚠️  Actual deployment will install K3s agents
          {% else %}
          ✅ Running in deployment mode - Installing K3s agent
          {% endif %}
          Server IP: {{ k3s_server_ip }}
          ========================================

    - name: Download K3s binary
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
        dest: /usr/local/bin/k3s
        mode: '0755'
        owner: root
        group: root
      when: not ansible_check_mode

    - name: Install K3s agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - agent \
          --token "{{ k3s_token }}" \
          --server "https://{{ k3s_server_ip }}:6443" \
          --node-external-ip "{{ ansible_default_ipv4.address }}" \
          --node-ip "{{ private_ip }}"
      args:
        creates: /etc/systemd/system/k3s-agent.service
      when: not ansible_check_mode

    - name: Ensure K3s agent service is started and enabled
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: yes
        daemon_reload: yes
      when: not ansible_check_mode

    - name: Wait for K3s agent to be ready
      ansible.builtin.wait_for:
        timeout: 60
      when: not ansible_check_mode

    # Planning mode summary for agent installation
    - name: K3s agent installation summary (planning mode)
      ansible.builtin.debug:
        msg: |
          ========================================
          📋 K3S AGENT INSTALLATION PLAN
          ========================================
          
          During actual deployment, this node will:
          
          1. ✅ Download K3s {{ k3s_version }} binary
          2. ✅ Install K3s agent joining server at {{ k3s_server_ip }}:6443
          3. ✅ Configure external IP: {{ ansible_default_ipv4.address }}
          4. ✅ Configure internal IP: {{ private_ip }}
          5. ✅ Start and enable K3s-agent systemd service
          6. ✅ Join the cluster automatically
          
          ⚠️  Installation skipped during planning
          ✅ Actual deployment will install everything
          ========================================
      when: ansible_check_mode

# Cluster Verification and Kubeconfig Output
- name: Verify K3s Cluster and Output Kubeconfig
  hosts: "{{ groups['tofu'][0] }}"
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Check if we're running in check mode (planning)
      ansible.builtin.debug:
        msg: |
          ========================================
          ANSIBLE CHECK MODE DETECTION
          ========================================
          Check mode (planning): {{ ansible_check_mode }}
          {% if ansible_check_mode %}
          ⚠️  Running in planning mode - K3s verification tasks will be skipped
          This is normal during Spacelift planning phase.
          ⚠️  Actual deployment will run all verification tasks.
          {% else %}
          ✅ Running in deployment mode - All tasks will execute
          {% endif %}
          ========================================

    - name: Wait for all nodes to join cluster
      ansible.builtin.shell: k3s kubectl get nodes --no-headers | wc -l
      register: node_count
      retries: 20
      delay: 30
      until: node_count.stdout | int == groups['tofu'] | length
      when: not ansible_check_mode

    - name: Display current cluster status during each retry
      block:
        - name: Get current cluster state
          ansible.builtin.shell: k3s kubectl get nodes -o wide
          register: current_nodes
          failed_when: false

        - name: Show detailed waiting information
          ansible.builtin.debug:
            msg: |
              ========================================
              K3S CLUSTER JOIN STATUS (Retry {{ ansible_loop.index }}/20)
              ========================================
              Expected nodes: {{ groups['tofu'] | length }}
              Current nodes found: {{ node_count.stdout | default('0') }}
              
              Current cluster state:
              {{ current_nodes.stdout | default('No nodes found yet - K3s may not be running') }}
              
              Node details we're waiting for:
              {% for host in groups['tofu'] %}
              - {{ host }} ({{ hostvars[host]['private_ip'] }}) - Role: {{ hostvars[host]['node_role'] | default('k8s-node') }}
              {% endfor %}
              
              {% if node_count.stdout | int < groups['tofu'] | length %}
              ⏳ Still waiting for {{ groups['tofu'] | length - (node_count.stdout | int) }} more node(s) to join...
              Next check in 30 seconds ({{ 20 - ansible_loop.index }} retries remaining)
              {% else %}
              ✅ All nodes have joined the cluster!
              {% endif %}
              ========================================
      when: not ansible_check_mode and node_count.stdout | int < groups['tofu'] | length

    - name: Get cluster nodes
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: cluster_nodes
      when: not ansible_check_mode

    - name: Get cluster info
      ansible.builtin.command: k3s kubectl cluster-info
      register: cluster_info
      when: not ansible_check_mode

    - name: Read kubeconfig file
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_content
      when: not ansible_check_mode

    - name: Create modified kubeconfig with external IP
      ansible.builtin.copy:
        content: "{{ kubeconfig_content.content | b64decode | regex_replace('127.0.0.1', ansible_default_ipv4.address) }}"
        dest: /tmp/kubeconfig.yaml
        mode: '0644'
      when: not ansible_check_mode

    - name: Read modified kubeconfig
      ansible.builtin.slurp:
        src: /tmp/kubeconfig.yaml
      register: external_kubeconfig
      when: not ansible_check_mode

    - name: Display K3s cluster information
      ansible.builtin.debug:
        msg: |
          =========================================
          🎉 K3S CLUSTER DEPLOYED SUCCESSFULLY! 🎉
          =========================================
          
          Cluster Information:
          {{ cluster_info.stdout }}
          
          Cluster Nodes:
          {{ cluster_nodes.stdout }}
          
          🔐 KUBECONFIG (save this to ~/.kube/config):
          
          {{ external_kubeconfig.content | b64decode }}
          
          =========================================
          Access your cluster with:
          kubectl --kubeconfig=kubeconfig.yaml get nodes
          
          Or save the kubeconfig:
          echo "KUBECONFIG_CONTENT" > ~/.kube/config
          =========================================
      when: not ansible_check_mode

    - name: Save kubeconfig to local file for easy access
      ansible.builtin.copy:
        content: "{{ external_kubeconfig.content | b64decode }}"
        dest: "/tmp/k3s-kubeconfig-{{ ansible_date_time.epoch }}.yaml"
        mode: '0644'
      when: not ansible_check_mode

    - name: Test cluster access
      ansible.builtin.command: k3s kubectl get pods -A
      register: all_pods
      when: not ansible_check_mode

    - name: Display running pods
      ansible.builtin.debug:
        msg: |
          Running Pods in Cluster:
          {{ all_pods.stdout }}
      when: not ansible_check_mode

    - name: Output kubeconfig for Kubernetes stack dependency
      ansible.builtin.set_stats:
        data:
          kubeconfig_content: "{{ external_kubeconfig.content | b64decode }}"
      when: not ansible_check_mode

    # Planning mode placeholder tasks
    - name: Planning mode summary
      ansible.builtin.debug:
        msg: |
          ========================================
          📋 ANSIBLE PLANNING MODE SUMMARY
          ========================================
          
          During actual deployment, this playbook will:
          
          1. ✅ Install K3s server on: {{ groups['tofu'][0] }}
          2. ✅ Install K3s agents on: {{ groups['tofu'][1:] | join(', ') }}
          3. ✅ Wait for all {{ groups['tofu'] | length }} nodes to join cluster
          4. ✅ Generate and output kubeconfig file
          5. ✅ Verify cluster health and display status
          
          Expected cluster nodes:
          {% for host in groups['tofu'] %}
          - {{ host }} ({{ hostvars[host]['private_ip'] }}) - {{ hostvars[host]['node_role'] | default('k8s-node') }}
          {% endfor %}
          
          ⚠️  K3s installation and verification skipped during planning
          ✅ Actual deployment will install and configure everything
          ========================================
      when: ansible_check_mode

- name: Test Network Connectivity Between Nodes
  hosts: tofu
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Display network information
      ansible.builtin.debug:
        msg: |
          Node: {{ inventory_hostname }}
          Private IP: {{ private_ip }}
          Public IP: {{ ansible_default_ipv4.address }}
          VPC CIDR: From AWS outputs
          Subnet: {{ ansible_default_ipv4.network }}/{{ ansible_default_ipv4.netmask }}

    - name: Test ping connectivity to all other nodes
      ansible.builtin.command: ping -c 3 {{ hostvars[item]['private_ip'] }}
      loop: "{{ groups['tofu'] }}"
      when: item != inventory_hostname
      register: ping_results
      failed_when: ping_results.rc != 0

    - name: Test K3s server port connectivity (6443)
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['tofu'][0]]['private_ip'] }}"
        port: 6443
        timeout: 10
        state: started
      when: inventory_hostname != groups['tofu'][0]
      ignore_errors: yes
      register: k3s_port_test

    - name: Display connectivity test results
      ansible.builtin.debug:
        msg: |
          ========================================
          NETWORK CONNECTIVITY TEST RESULTS
          ========================================
          {% for result in ping_results.results | default([]) %}
          Ping to {{ hostvars[result.item]['private_ip'] }}: {{ 'SUCCESS' if result.rc == 0 else 'FAILED' }}
          {% endfor %}
          
          K3s Port 6443: {{ 'REACHABLE' if k3s_port_test is succeeded else 'NOT YET AVAILABLE' }}
